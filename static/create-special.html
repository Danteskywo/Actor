<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавить специализацию</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <div class="panel">
            <h1>Добавить специализацию</h1>
            <div class="auth-header">
                <button class="auth-button" id="auth-btn">🔐 Войти</button>
            </div>
        </div>
        
        <div class="nav">
            <a href="/">Главная</a>
            <a href="/actors-page.html">Все актеры</a>
            <a href="/create-actor.html" class="requires-auth">Добавить актера</a>
            <a href="/create-special.html" class="requires-auth">Добавить специализацию</a>
            <a href="/special-page.html">Все специализации</a>
            <a href="/docs" target="_blank">API Docs</a>
        </div>
        
        <div class="content">
            <form id="special-form">
                <div class="form-group">
                    <label>Название специализации</label>
                    <input type="text" id="special_name" required placeholder="Например: Драматические роли">
                </div>
                
                <div class="form-group">
                    <label>Описание</label>
                    <textarea id="special_description" placeholder="Описание специализации..."></textarea>
                </div>
                
                <div class="form-actions">
                    <button type="submit" id="submit-btn">Сохранить</button>
                    <button type="button" onclick="location.href='/special-page.html'">Отмена</button>
                </div>
            </form>
        </div>
        
        <footer>
            <p><a href="/special-page.html">← Назад к списку</a></p>
        </footer>
    </div>
    
    <script>
        // Проверка авторизации
        function checkAuth() {
            const token = localStorage.getItem('token');
            const authBtn = document.getElementById('auth-btn');
            const submitBtn = document.getElementById('submit-btn');
            
            if (token) {
                authBtn.innerHTML = '🚪 Выйти';
                authBtn.onclick = logout;
                submitBtn.disabled = false;
            } else {
                authBtn.innerHTML = '🔐 Войти';
                authBtn.onclick = function() {
                    location.href = '/actors-page-autorize.html';
                };
                submitBtn.disabled = true;
                submitBtn.title = 'Требуется вход в систему';
                submitBtn.style.opacity = '0.5';
                submitBtn.style.cursor = 'not-allowed';
            }
        }
        
        function logout() {
            localStorage.removeItem('token');
            alert('Вы вышли из системы');
            location.reload();
        }
        
        function requireAuth() {
            const token = localStorage.getItem('token');
            if (!token) {
                alert('Для добавления специализации необходимо войти в систему');
                location.href = '/actors-page-autorize.html';
                return false;
            }
            return true;
        }
        
        document.getElementById('special-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!requireAuth()) return;
            
            const specialData = {
                special_name: document.getElementById('special_name').value,
                special_description: document.getElementById('special_description').value || null
            };
            
            console.log("Отправляемые данные:", specialData);
            
            const token = localStorage.getItem('token');
            
            try {
                const response = await fetch('/specials/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(specialData)
                });
                
                console.log("Статус ответа:", response.status, response.statusText);
                
                const responseText = await response.text();
                console.log("Сырой ответ:", responseText);
                
                if (!response.ok) {
                    if (response.status === 401) {
                        alert('Сессия истекла. Пожалуйста, войдите снова.');
                        localStorage.removeItem('token');
                        checkAuth();
                        return;
                    }
                    
                    let errorDetail = response.statusText;
                    
                    try {
                        const errorJson = JSON.parse(responseText);
                        errorDetail = errorJson.detail || errorJson.message || responseText;
                    } catch {
                        errorDetail = responseText || response.statusText;
                    }
                    
                    alert(`Ошибка ${response.status}: ${errorDetail}`);
                    return;
                }
                
                try {
                    const result = JSON.parse(responseText);
                    console.log("Успешный ответ:", result);
                    alert('Специализация успешно добавлена!');
                    location.href = '/special-page.html';
                } catch {
                    alert('Специализация добавлена, но получен неожиданный ответ');
                }
                
            } catch (error) {
                console.error("Ошибка сети:", error);
                alert('Ошибка сети: ' + error.message);
            }
        });
        
        window.onload = checkAuth;
    </script>
</body>
</html>
