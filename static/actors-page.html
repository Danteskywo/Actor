<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Все актеры</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>Все актеры</h1>
        
        <div class="nav">
            <a href="/">Главная</a>
            <a href="/actors-page.html">Все актеры</a>
            <a href="/create-actor.html">Добавить актера</a>
            <a href="/create-special.html">Добавить специализацию</a>
            <a href="/special-page.html">Все специализации</a>
            <a href="/docs" target="_blank">API Docs</a>
        </div>
        
        <div class="controls">
            <input type="text" id="search" placeholder="Поиск по имени..." onkeyup="searchActors()">
            <button onclick="loadActors()">Обновить</button>
        </div>
        
        <div id="loading">Загрузка...</div>
        
        <div id="actors-list"></div>
        
        <div id="no-actors" style="display:none;">
            <p>Нет актеров в базе.</p>
            <button onclick="location.href='/create-actor.html'">Добавить первого актера</button>
        </div>

        <div id="edit-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center;">
            <div style="background: rgba(30, 30, 46, 0.95); padding: 30px; border-radius: 15px; width: 500px; max-width: 90%;">
                <h2>Редактировать актера</h2>
                <form id="edit-actor-form">
                    <input type="hidden" id="edit-actor-id">
                    
                    <div class="form-group">
                        <label>Имя</label>
                        <input type="text" id="edit-first_name" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Фамилия</label>
                        <input type="text" id="edit-last_name" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="edit-email" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Оскары (победы)</label>
                        <input type="number" id="edit-oscar_wins" min="0" value="0">
                    </div>
                    
                    <div class="form-group">
                        <label>Оскары (номинации)</label>
                        <input type="number" id="edit-oscar_nominations" min="0" value="0">
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit">Сохранить</button>
                        <button type="button" onclick="closeEditModal()">Отмена</button>
                    </div>
                </form>
            </div>
        </div>
        
        <footer>
            <p><a href="/">← На главную</a></p>
        </footer>
    </div>
    
    <script>
        let currentActorId = null;
        
        async function loadActors() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('actors-list').innerHTML = '';
            
            try {
                const response = await fetch('/actors/');
                const actors = await response.json();
                
                if (actors.length === 0) {
                    document.getElementById('no-actors').style.display = 'block';
                    document.getElementById('loading').style.display = 'none';
                    return;
                }
                
                let html = '<table>';
                html += '<tr><th>ID</th><th>Имя</th><th>Фамилия</th><th>Дата рождения</th><th>Оскары</th><th>Действия</th></tr>';
                
                for (const actor of actors) {
                    html += `
                    <tr>
                        <td>${actor.id}</td>
                        <td>${actor.first_name}</td>
                        <td>${actor.last_name}</td>
                        <td>${actor.date_of_birth}</td>
                        <td>🏆 ${actor.oscar_wins}</td>
                        <td>
                            <button onclick="editActor(${actor.id})" class="edit-btn">Изменить</button>
                            <button onclick="deleteActor(${actor.id})" class="delete-btn">Удалить</button>
                        </td>
                    </tr>
                    `;
                }
                
                html += '</table>';
                document.getElementById('actors-list').innerHTML = html;
                
            } catch (error) {
                document.getElementById('actors-list').innerHTML = 
                    '<p style="color: red;">Ошибка загрузки: ' + error.message + '</p>';
            }
            
            document.getElementById('loading').style.display = 'none';
        }
        
        async function editActor(id) {
            currentActorId = id;
            
            try {
                const response = await fetch(`/actors/${id}`);
                if (!response.ok) {
                    throw new Error('Актер не найден');
                }
                
                const actor = await response.json();
                
                document.getElementById('edit-actor-id').value = actor.id;
                document.getElementById('edit-first_name').value = actor.first_name;
                document.getElementById('edit-last_name').value = actor.last_name;
                document.getElementById('edit-email').value = actor.email;
                document.getElementById('edit-oscar_wins').value = actor.oscar_wins;
                document.getElementById('edit-oscar_nominations').value = actor.oscar_nominations;
                
                document.getElementById('edit-modal').style.display = 'flex';
                
            } catch (error) {
                alert('Ошибка загрузки данных: ' + error.message);
            }
        }
        
        function closeEditModal() {
            document.getElementById('edit-modal').style.display = 'none';
            currentActorId = null;
            document.getElementById('edit-actor-form').reset();
        }
        
        document.getElementById('edit-actor-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!currentActorId) return;
            
            const actorData = {
                first_name: document.getElementById('edit-first_name').value,
                last_name: document.getElementById('edit-last_name').value,
                email: document.getElementById('edit-email').value,
                oscar_wins: parseInt(document.getElementById('edit-oscar_wins').value) || 0,
                oscar_nominations: parseInt(document.getElementById('edit-oscar_nominations').value) || 0
            };
            
            try {
                const response = await fetch(`/actors/${currentActorId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(actorData)
                });
                
                if (response.ok) {
                    alert('Актер успешно обновлен!');
                    closeEditModal();
                    loadActors();
                } else {
                    const error = await response.json();
                    alert('Ошибка: ' + error.detail);
                }
            } catch (error) {
                alert('Ошибка сети: ' + error.message);
            }
        });
        
        async function deleteActor(id) {
            if (!confirm('Удалить актера?')) return;
            
            try {
                const response = await fetch(`/actors/${id}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    alert('Актер удален!');
                    loadActors();
                } else {
                    const error = await response.json();
                    alert('Ошибка: ' + error.detail);
                }
            } catch (error) {
                alert('Ошибка: ' + error.message);
            }
        }
        
        function searchActors() {
            const search = document.getElementById('search').value.toLowerCase();
            const rows = document.querySelectorAll('#actors-list tr');
            
            for (let i = 1; i < rows.length; i++) {
                const cells = rows[i].querySelectorAll('td');
                const name = cells[1].textContent.toLowerCase() + ' ' + cells[2].textContent.toLowerCase();
                rows[i].style.display = name.includes(search) ? '' : 'none';
            }
        }
        
        window.onload = loadActors;
    </script>
</body>
</html>
