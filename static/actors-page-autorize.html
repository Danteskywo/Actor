<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в аккаунт</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>Добро пожаловать</h1>
        
        <div class="auth-buttons" style="display: flex; gap: 20px; justify-content: center; margin: 40px 0;">
            <button onclick="showRegisterForm()">
                📝 Зарегистрироваться
            </button>
            <button onclick="location.href='/index-autorize.html'">
                🔐 Войти
            </button>
        </div>
        
        <div id="register-form" style="display: none; margin-top: 30px;">
            <div class="form-group">
                <label>Имя пользователя</label>
                <input type="text" id="username" placeholder="Введите имя пользователя">
            </div>
            
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Введите email">
            </div>
            
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="password" placeholder="Введите пароль">
            </div>
            
            <div class="form-group">
                <label>Повторите пароль</label>
                <input type="password" id="confirm_password" placeholder="Повторите пароль">
            </div>
            
            <div class="form-actions">
                <button onclick="register()">Зарегистрироваться</button>
                <button onclick="hideRegisterForm()">Отмена</button>
            </div>
            
            <div id="message" style="margin-top: 20px; text-align: center;"></div>
        </div>
        
        <div style="text-align: center; margin-top: 30px;">
            <p><a href="/" style="color: #64ffda;">← Вернуться на главную</a></p>
        </div>
    </div>
    
    <script>
        function showRegisterForm() {
            document.getElementById('register-form').style.display = 'block';
            document.getElementById('register-form').scrollIntoView({ behavior: 'smooth' });
        }
        
        function hideRegisterForm() {
            document.getElementById('register-form').style.display = 'none';
            document.getElementById('message').innerHTML = '';
        }
        
        async function register() {
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const message = document.getElementById('message');
            
            if (!username || !email || !password) {
                message.innerHTML = '<p class="alert alert-error">Заполните все поля</p>';
                return;
            }
            
            if (password !== confirmPassword) {
                message.innerHTML = '<p class="alert alert-error">Пароли не совпадают</p>';
                return;
            }
            
            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, email, password })
                });
                
                if (response.ok) {
                    message.innerHTML = '<p class="alert alert-success">Регистрация успешна! Теперь войдите в систему.</p>';
                    setTimeout(() => {
                        hideRegisterForm();
                        location.href = '/index-autorize.html';
                    }, 2000);
                } else {
                    const error = await response.json();
                    message.innerHTML = `<p class="alert alert-error">Ошибка: ${error.detail}</p>`;
                }
            } catch (error) {
                message.innerHTML = `<p class="alert alert-error">Ошибка сети: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
