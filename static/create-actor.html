<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавить актера</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1> Добавить актера</h1>
        
        <div class="nav">
            <a href="/">Главная</a>
            <a href="/actors-page.html">Все актеры</a>
            <a href="/create-actor.html" style="color: #4CAF50;">Добавить актера</a>
            <a href="/docs" target="_blank">API Docs</a>
        </div>
        
        <div class="content">
            <form id="actor-form">
                <div class="form-group">
                    <label>Имя </label>
                    <input type="text" id="first_name" required>
                </div>
                
                <div class="form-group">
                    <label>Фамилия </label>
                    <input type="text" id="last_name" required>
                </div>
                
                <div class="form-group">
                    <label>Дата рождения </label>
                    <input type="date" id="date_of_birth" required>
                </div>
                
                <div class="form-group">
                    <label>Email </label>
                    <input type="email" id="email" required>
                </div>
                
                <div class="form-group">
                    <label>Телефон </label>
                    <input type="text" id="phone_number" required placeholder="+79991234567">
                </div>
                
                <div class="form-group">
                    <label>Адрес *</label>
                    <input type="text" id="address" required>
                </div>
                
                <div class="form-group">
                    <label>Год начала карьеры *</label>
                    <input type="number" id="career_start" min="1900" max="2024" value="2000" required>
                </div>
                
                <div class="form-group">
                    <label>Победы Оскар</label>
                    <input type="number" id="oscar_wins" min="0" value="0">
                </div>
                
                <div class="form-group">
                    <label>Номинации Оскар</label>
                    <input type="number" id="oscar_nominations" min="0" value="0">
                </div>
                
                <div class="form-group">
                    <label>Примечания</label>
                    <textarea id="special_notes"></textarea>
                </div>
                
                <div class="form-actions">
                    <button type="submit"> Сохранить</button>
                    <button type="button" onclick="location.href='/actors-page.html'">❌ Отмена</button>
                </div>
            </form>
        </div>
        
        <footer>
            <p><a href="/actors-page.html">← Назад к списку</a></p>
        </footer>
    </div>
    
    <script>
        document.getElementById('actor-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const actorData = {
        first_name: document.getElementById('first_name').value,
        last_name: document.getElementById('last_name').value,
        date_of_birth: document.getElementById('date_of_birth').value,
        email: document.getElementById('email').value,
        phone_number: document.getElementById('phone_number').value,
        address: document.getElementById('address').value,
        career_start: parseInt(document.getElementById('career_start').value),
        oscar_wins: parseInt(document.getElementById('oscar_wins').value) || 0,
        oscar_nominations: parseInt(document.getElementById('oscar_nominations').value) || 0,
        special_notes: document.getElementById('special_notes').value,
        specialty: []
    };
    
    console.log("📤 Отправляемые данные:", actorData);
    
    try {
        const response = await fetch('/post/actors/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(actorData)
        });
        
        console.log("📥 Статус ответа:", response.status, response.statusText);
        
        // Всегда пытаемся прочитать как текст
        const responseText = await response.text();
        console.log("📥 Сырой ответ:", responseText);
        
        if (!response.ok) {
            let errorDetail = response.statusText;
            
            // Пытаемся распарсить JSON ошибки
            try {
                const errorJson = JSON.parse(responseText);
                errorDetail = errorJson.detail || errorJson.message || responseText;
            } catch {
                // Если не JSON, используем текст
                errorDetail = responseText || response.statusText;
            }
            
            alert(`❌ Ошибка ${response.status}: ${errorDetail}`);
            return;
        }
        
        // Успех
        try {
            const result = JSON.parse(responseText);
            console.log("✅ Успешный ответ:", result);
            alert('✅ Актер успешно добавлен!');
            location.href = '/actors-page.html';
        } catch {
            alert('✅ Актер добавлен, но получен неожиданный ответ');
        }
        
    } catch (error) {
        console.error("❌ Ошибка сети:", error);
        alert('❌ Ошибка сети: ' + error.message);
    }
});
    </script>
</body>
</html>
