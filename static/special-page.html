<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Все специализации</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <div class="panel">
            <h1>Все специализации</h1>
            <div class="auth-header">
                <button class="auth-button" id="auth-btn">🔐 Войти</button>
            </div>
        </div>
        
        <div class="nav">
            <a href="/">Главная</a>
            <a href="/actors-page.html">Все актеры</a>
            <a href="/create-actor.html" class="requires-auth">Добавить актера</a>
            <a href="/create-special.html" class="requires-auth">Добавить специализацию</a>
            <a href="/special-page.html">Все специализации</a>
            <a href="/docs" target="_blank">API Docs</a>
        </div>
        
        <div class="controls">
            <input type="text" id="search" placeholder="Поиск по названию..." onkeyup="searchSpecials()">
            <button onclick="loadSpecials()">Обновить</button>
        </div>
        
        <div id="loading">Загрузка...</div>
        
        <div id="special-list"></div>
        
        <div id="no-specials" style="display:none;">
            <p>Нет специализаций в базе.</p>
            <button onclick="location.href='/create-special.html'" class="requires-auth">Добавить первую специализацию</button>
        </div>

        <div id="edit-special-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center;">
            <div style="background: rgba(30, 30, 46, 0.95); padding: 30px; border-radius: 15px; width: 500px; max-width: 90%;">
                <h2>Редактировать специализацию</h2>
                <form id="edit-special-form">
                    <input type="hidden" id="edit-special-id">
                    
                    <div class="form-group">
                        <label>Название специализации</label>
                        <input type="text" id="edit-special_name" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Описание</label>
                        <textarea id="edit-special_description"></textarea>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit">Сохранить</button>
                        <button type="button" onclick="closeEditSpecialModal()">Отмена</button>
                    </div>
                </form>
            </div>
        </div>
        
        <footer>
            <p><a href="/">← На главную</a></p>
        </footer>
    </div>
    
    <script>
        let currentSpecialId = null;
        
        // Проверка авторизации
        function checkAuth() {
            const token = localStorage.getItem('token');
            const authBtn = document.getElementById('auth-btn');
            
            if (token) {
                authBtn.innerHTML = '🚪 Выйти';
                authBtn.onclick = logout;
                // Разблокируем все элементы
                document.querySelectorAll('.requires-auth').forEach(el => {
                    el.style.pointerEvents = 'auto';
                    el.style.opacity = '1';
                });
            } else {
                authBtn.innerHTML = '🔐 Войти';
                authBtn.onclick = function() {
                    location.href = '/actors-page-autorize.html';
                };
                // Блокируем элементы, требующие авторизации
                blockUnauthorizedButtons();
            }
        }
        
        function logout() {
            localStorage.removeItem('token');
            alert('Вы вышли из системы');
            location.reload();
        }
        
        function blockUnauthorizedButtons() {
            document.querySelectorAll('.requires-auth').forEach(el => {
                el.style.pointerEvents = 'none';
                el.style.opacity = '0.5';
            });
            
            document.querySelectorAll('.edit-btn, .delete-btn').forEach(btn => {
                btn.style.display = 'none';
            });
        }
        
        function requireAuth(action) {
            const token = localStorage.getItem('token');
            if (!token) {
                alert('Для этого действия необходимо войти в систему');
                location.href = '/actors-page-autorize.html';
                return false;
            }
            return true;
        }
        
        async function loadSpecials() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('special-list').innerHTML = '';
            document.getElementById('no-specials').style.display = 'none';
            
            try {
                const response = await fetch('/specials/');
                if (!response.ok) {
                    throw new Error(`Ошибка HTTP: ${response.status}`);
                }
                const specials = await response.json();
                
                if (specials.length === 0) {
                    document.getElementById('no-specials').style.display = 'block';
                    document.getElementById('loading').style.display = 'none';
                    return;
                }
                
                let html = '<table>';
                html += '<tr><th>ID</th><th>Название</th><th>Описание</th><th>Количество актеров</th><th>Действия</th></tr>';
                
                for (const special of specials) {
                    const token = localStorage.getItem('token');
                    const actionButtons = token ? `
                        <button onclick="editSpecial(${special.id})" class="edit-btn">Изменить</button>
                        <button onclick="deleteSpecial(${special.id})" class="delete-btn">Удалить</button>
                    ` : '<span style="color:#888">Требуется вход</span>';
                    
                    html += `
                    <tr>
                        <td>${special.id}</td>
                        <td>${special.special_name}</td>
                        <td>${special.special_description || 'Нет описания'}</td>
                        <td>${special.count_actor || 0}</td>
                        <td>${actionButtons}</td>
                    </tr>
                    `;
                }
                
                html += '</table>';
                document.getElementById('special-list').innerHTML = html;
                
            } catch (error) {
                document.getElementById('special-list').innerHTML = 
                    '<p style="color: red;">Ошибка загрузки: ' + error.message + '</p>';
            }
            
            document.getElementById('loading').style.display = 'none';
        }
        
        async function editSpecial(id) {
            if (!requireAuth()) return;
            currentSpecialId = id;
            
            try {
                const response = await fetch(`/specials/${id}`);
                if (!response.ok) {
                    throw new Error('Специализация не найдена');
                }
                
                const special = await response.json();
                
                document.getElementById('edit-special-id').value = special.id;
                document.getElementById('edit-special_name').value = special.special_name;
                document.getElementById('edit-special_description').value = special.special_description || '';
                
                document.getElementById('edit-special-modal').style.display = 'flex';
                
            } catch (error) {
                alert('Ошибка загрузки данных: ' + error.message);
            }
        }
        
        function closeEditSpecialModal() {
            document.getElementById('edit-special-modal').style.display = 'none';
            currentSpecialId = null;
            document.getElementById('edit-special-form').reset();
        }
        
        document.getElementById('edit-special-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!currentSpecialId) return;
            
            const token = localStorage.getItem('token');
            if (!token) {
                alert('Для этого действия необходимо войти в систему');
                return;
            }
            
            const specialData = {
                special_name: document.getElementById('edit-special_name').value,
                special_description: document.getElementById('edit-special_description').value || null
            };
            
            try {
                const response = await fetch(`/specials/${currentSpecialId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(specialData)
                });
                
                if (response.ok) {
                    alert('Специализация успешно обновлена!');
                    closeEditSpecialModal();
                    loadSpecials();
                } else if (response.status === 401) {
                    alert('Сессия истекла. Пожалуйста, войдите снова.');
                    localStorage.removeItem('token');
                    checkAuth();
                } else {
                    const error = await response.json();
                    alert('Ошибка: ' + error.detail);
                }
            } catch (error) {
                alert('Ошибка сети: ' + error.message);
            }
        });
        
        async function deleteSpecial(id) {
            if (!requireAuth()) return;
            
            if (!confirm('Удалить специализацию?')) return;
            
            const token = localStorage.getItem('token');
            
            try {
                const response = await fetch(`/specials/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    alert('Специализация удалена!');
                    loadSpecials();
                } else if (response.status === 401) {
                    alert('Сессия истекла. Пожалуйста, войдите снова.');
                    localStorage.removeItem('token');
                    checkAuth();
                } else {
                    const error = await response.json();
                    alert('Ошибка: ' + error.detail);
                }
            } catch (error) {
                alert('Ошибка: ' + error.message);
            }
        }
        
        function searchSpecials() {
            const search = document.getElementById('search').value.toLowerCase();
            const rows = document.querySelectorAll('#special-list tr');
            
            for (let i = 1; i < rows.length; i++) {
                const cells = rows[i].querySelectorAll('td');
                const name = cells[1].textContent.toLowerCase();
                const desc = cells[2].textContent.toLowerCase();
                rows[i].style.display = (name.includes(search) || desc.includes(search)) ? '' : 'none';
            }
        }
        
        window.onload = function() {
            checkAuth();
            loadSpecials();
        };
    </script>
</body>
</html>
